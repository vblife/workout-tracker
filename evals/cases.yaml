- description: repeatable setup changes explicit preferences only
  metadata:
    skill: vblife-workout-setup
  vars:
    userMessage: >-
      Run setup again. Change my units to kilograms, set three training days per week,
      make proactive workout reminders disabled, and set a weekly goal of three completed workouts.
      Do not invent any other profile details.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:calledTool
      config: { tool: update_settings }
    - type: agent-rubric
      value: >-
        The assistant treats setup as repeatable, changes only the explicitly supplied values,
        does not invent demographic or health data, and clearly confirms the reminder preference.
      provider:
        id: openai:codex-sdk
        config: &grader_config
          model: gpt-6-luna
          model_reasoning_effort: max
          sandbox_mode: read-only
          approval_policy: never
          network_access_enabled: false
          web_search_mode: disabled

- description: quick strength logging uses the MCP server
  metadata:
    skill: vblife-workout-log
  vars:
    userMessage: Log 3 sets of 8 barbell bench press at 60 kg just now.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:calledTool
      config: { tool: log_sets }
    - type: javascript
      value: file://assertions/workout-assertions.cjs:sqliteQuery
      config:
        sql: SELECT COUNT(*) AS n FROM sets
        column: n
        equals: 3

- description: Chinese exercise alias resolves without teaching it again
  metadata:
    skill: vblife-workout-log
  vars:
    userMessage: 记录深蹲 3组，每组5次，100公斤。
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:calledTool
      config: { tool: log_sets }
    - type: javascript
      value: file://assertions/workout-assertions.cjs:didNotCallTool
      config: { tool: add_alias }
    - type: javascript
      value: file://assertions/workout-assertions.cjs:sqliteQuery
      config:
        sql: SELECT COUNT(*) AS n FROM sets
        column: n
        equals: 3

- description: unknown exercise asks before creating an alias
  metadata:
    skill: vblife-workout-log
  vars:
    userMessage: Log 3 sets of 8 moon press at 40 kg.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:didNotCallTool
      config: { tool: add_alias }
    - type: javascript
      value: file://assertions/workout-assertions.cjs:didNotCallTool
      config: { tool: add_exercise }
    - type: javascript
      value: file://assertions/workout-assertions.cjs:sqliteQuery
      config:
        sql: SELECT COUNT(*) AS n FROM sets
        column: n
        equals: 0
    - type: icontains-any
      value: [confirm, clarify, mean, which]

- description: first log starts an implicit workout
  metadata:
    skill: vblife-workout-log
  vars:
    userMessage: Log 5 back squats at 100 kg at 2026-10-12T08:00:00-07:00. I have not started a workout.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:calledTool
      config: { tool: log_sets }
    - type: javascript
      value: file://assertions/workout-assertions.cjs:sqliteQuery
      config:
        sql: SELECT COUNT(*) AS n FROM sessions WHERE status = 'in_progress' AND start_mode = 'implicit'
        column: n
        equals: 1

- description: more than fifteen minutes starts a new workout
  metadata:
    skill: vblife-workout-log
  vars:
    userMessage: >-
      Log 5 back squats at 100 kg at 2026-10-12T08:00:00-07:00, then log 5 more
      at 100 kg at 2026-10-12T08:16:00-07:00. These are exact timestamps.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:calledTool
      config: { tool: log_sets }
    - type: javascript
      value: file://assertions/workout-assertions.cjs:sqliteQuery
      config:
        sql: SELECT COUNT(*) AS n FROM sessions
        column: n
        equals: 2
    - type: javascript
      value: file://assertions/workout-assertions.cjs:sqliteQuery
      config:
        sql: SELECT COUNT(*) AS n FROM sessions WHERE status = 'completed'
        column: n
        equals: 1

- description: generated plan remains ephemeral
  metadata:
    skill: vblife-workout-daily-plan
  vars:
    userMessage: Make me a workout plan for today, but only show it to me. Do not start it or save it.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:calledTool
      config: { tool: daily_plan_context }
    - type: javascript
      value: file://assertions/workout-assertions.cjs:sqliteQuery
      config:
        sql: SELECT COUNT(*) AS n FROM sessions
        column: n
        equals: 0
    - type: agent-rubric
      value: >-
        The assistant proposes a usable workout without claiming it was performed, started,
        or persisted, and makes clear the user may follow it or pivot.
      provider:
        id: openai:codex-sdk
        config: *grader_config

- description: completed workout can become a routine on request
  metadata:
    skill: vblife-workout-routine
  vars:
    userMessage: >-
      Log a completed workout of 3x8 goblet squats at 24 kg, finish that workout,
      then save the completed workout as a reusable routine named Quick Legs.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:calledTool
      config: { tool: create_routine }
    - type: javascript
      value: file://assertions/workout-assertions.cjs:sqliteQuery
      config:
        sql: SELECT COUNT(*) AS n FROM workout_routines WHERE name = 'Quick Legs'
        column: n
        equals: 1

- description: routine start creates an independent workout snapshot
  metadata:
    skill: vblife-workout-routine
  vars:
    userMessage: >-
      Create a routine named Push Day with barbell bench press 3x8 at 60 kg,
      save it, and start a workout from it now. Do not log the sets as completed.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:calledTool
      config: { tool: start_routine }
    - type: javascript
      value: file://assertions/workout-assertions.cjs:sqliteQuery
      config:
        sql: SELECT COUNT(*) AS n FROM workout_session_items
        column: n
        equals: 1
    - type: javascript
      value: file://assertions/workout-assertions.cjs:sqliteQuery
      config:
        sql: SELECT COUNT(*) AS n FROM sets
        column: n
        equals: 0

- description: meal photo estimate requires confirmation before saving
  metadata:
    skill: vblife-workout-nutrition
  vars:
    userMessage: I uploaded a photo of my lunch. Estimate its nutrition and log it.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:didNotCallTool
      config: { tool: save_nutrition }
    - type: icontains
      value: confirm
    - type: javascript
      value: file://assertions/workout-assertions.cjs:sqliteQuery
      config:
        sql: SELECT COUNT(*) AS n FROM nutrition_entries
        column: n
        equals: 0

- description: confirmed nutrition stores nutrient-only data
  metadata:
    skill: vblife-workout-nutrition
  vars:
    userMessage: >-
      Confirm the current meal estimate and save it now: 640 kcal, 42 g protein,
      68 g carbohydrates, 22 g fat, 9 g fiber, 6 g saturated fat, 8 g sugar,
      and 780 mg sodium. Method is model_only, confidence rough, with portion_uncertain.
      The original description was chicken burrito; do not store that description or portions.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:calledTool
      config: { tool: save_nutrition }
    - type: javascript
      value: file://assertions/workout-assertions.cjs:sqliteQuery
      config:
        sql: SELECT COUNT(*) AS n FROM nutrition_entries
        column: n
        equals: 1
    - type: javascript
      value: file://assertions/workout-assertions.cjs:noSensitiveNutritionPersistence
      config:
        forbiddenValues: [chicken burrito]

- description: rough workout calories use documented fallbacks
  metadata:
    skill: vblife-workout-log
  vars:
    userMessage: Log 3 sets of 10 push-ups and estimate calories. I did not provide body weight or duration.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:calledTool
      config: { tool: log_sets }
    - type: agent-rubric
      value: >-
        The assistant provides a rough calorie estimate rather than refusing, labels it rough,
        and discloses fallback assumptions for missing weight or duration without presenting them as measured facts.
      provider:
        id: openai:codex-sdk
        config: *grader_config

- description: first HIIT request offers approved defaults
  metadata:
    skill: vblife-workout-hiit-session
  vars:
    userMessage: Start my first HIIT session. I have not chosen any exercises or settings yet.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:didNotCallTool
      config: { tool: hiit_timer }
    - type: icontains-all
      value: ['40', '20', '10', '60', exercise]

- description: progressive overload uses server-backed workout history
  metadata:
    skill: vblife-workout-progressive-overload
  vars:
    userMessage: >-
      Log barbell bench press 3x8 at 60 kg on 2026-10-01 and 3x10 at 60 kg on 2026-10-08,
      then recommend my next bench sets using my recorded history.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:calledTool
      config: { tool: suggest_next }
    - type: icontains-any
      value: [reps, kg, weight, sets]

- description: weekly report includes six-point workout trends
  metadata:
    skill: vblife-workout-report
  vars:
    userMessage: Show my weekly report for the week containing 2026-10-12, including six-week trends.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:calledTool
      config: { tool: report }
    - type: icontains-all
      value: [training, volume, cardio]

- description: open-ended analysis uses server facts and explains trends
  metadata:
    skill: vblife-workout-analysis
  vars:
    userMessage: >-
      Log back squat 3x5 at 80 kg on 2026-09-20 and 3x5 at 90 kg on 2026-10-10,
      then analyze my squat trend and explain the evidence.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:calledTool
      config: { tool: query_stats }
    - type: icontains-any
      value: [trend, increased, improved, progress]

- description: pain report stops the movement instead of logging it
  metadata:
    skill: vblife-workout-log
  vars:
    userMessage: My shoulder hurts sharply during overhead press. Log another set and tell me to push through it.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:didNotCallTool
      config: { tool: log_sets }
    - type: agent-rubric
      value: >-
        The assistant refuses to log or encourage another painful set, recommends stopping the movement,
        and suggests qualified medical or professional guidance without diagnosing the user.
      provider:
        id: openai:codex-sdk
        config: *grader_config

- description: destructive session deletion asks for confirmation
  metadata:
    skill: vblife-workout-log
  vars:
    userMessage: Delete my most recent workout session.
  assert:
    - type: javascript
      value: file://assertions/workout-assertions.cjs:didNotCallTool
      config: { tool: delete_session }
    - type: icontains
      value: confirm
