<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIIT Timer</title>
<style>
:root{color-scheme:light dark;--fg:#111}body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:14px;text-align:center;transition:background .3s;color:var(--fg)}
@media(prefers-color-scheme:dark){:root{--fg:#f5f7fa}body.work{background:#532929}body.rest{background:#244a31}body.warmup,body.cooldown,body.ready{background:#283957}body.done{background:#292d33}button{background:#202631;color:#f5f7fa}}
@media(max-width:600px){#t{font-size:68px}button{font-size:16px;padding:9px 14px}}
body.work{background:#ffe1e1}body.rest{background:#dcf5dc}body.warmup,body.cooldown,body.ready{background:#e3ecff}body.done{background:#eee}
#name{font-size:14px;opacity:.7}#ph{font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}#ex{font-size:24px;font-weight:600;min-height:30px}
#t{font-size:84px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}#meta{font-size:15px}#next{font-size:14px;opacity:.75;min-height:18px;margin-top:4px}
#bar{height:6px;background:#0002;border-radius:3px;margin:10px 0}#bar>div{height:100%;background:#333;border-radius:3px;width:0}
button{font-size:17px;padding:9px 18px;margin:4px;border-radius:10px;border:1px solid #888;background:#fff}button:disabled{opacity:.4}
#msg{font-size:14px;min-height:18px;margin-top:6px}#plan{font-size:12px;opacity:.7;margin-top:8px}code{background:#0001;padding:2px 4px;border-radius:4px}
</style></head><body class="ready">
<div id="name">HIIT</div><div id="ph">ready</div><div id="ex"></div><div id="t">--</div>
<div id="meta">Round <span id="r">0</span>/<span id="rt">0</span> · <span id="rem">0:00</span> left</div><div id="next"></div><div id="bar"><div></div></div>
<button id="b">Start</button><button id="sk">Skip</button><button id="end">Finish</button><div id="msg"></div><div id="plan"></div>
<script>
const $=i=>document.getElementById(i),fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
let cfg={name:"HIIT",rounds:20,segments:[{kind:"work",seconds:40},{kind:"rest",seconds:20}],warmup_s:10,cooldown_s:60,ready_s:0},hiitId=null;
/* Optional get-ready countdown before the first interval: ready_s seconds (0-60), default 0 = none. */
const readyS=()=>{const n=Math.round(+cfg.ready_s);return n>0?Math.min(n,60):0};
let plan=[],pi=0,left=0,iv=null,elapsed=0,started=false,logged=false,rid=1,pending={},bridge=false,countdown=0,ac=null;
function build(){plan=[];if(cfg.warmup_s)plan.push({kind:"warmup",seconds:cfg.warmup_s,round:0});
 for(let r=1;r<=cfg.rounds;r++)cfg.segments.forEach((s,j)=>{if(r==cfg.rounds&&j==cfg.segments.length-1&&s.kind=="rest")return;plan.push({...s,round:r})});
 if(cfg.cooldown_s)plan.push({kind:"cooldown",seconds:cfg.cooldown_s,round:cfg.rounds});pi=0;left=plan[0].seconds;elapsed=0;
 $('plan').textContent=cfg.rounds+" × ["+cfg.segments.map(s=>(s.exercise||s.kind)+" "+s.seconds+"s").join(" → ")+"]"+(cfg.warmup_s?" · warm-up "+cfg.warmup_s+"s":"")+(cfg.cooldown_s?" · cool-down "+cfg.cooldown_s+"s":"");draw()}
const total=()=>plan.reduce((a,x)=>a+x.seconds,0);
function draw(){const p=countdown?{kind:"ready",round:1}:(plan[pi]||{kind:"done",round:cfg.rounds});document.body.className=p.kind;$('name').textContent=cfg.name+(hiitId!=null?" #"+hiitId:"");
 $('ph').textContent=countdown?"get ready":p.kind;$('ex').textContent=countdown?(plan[0].exercise||""):(p.exercise||(p.kind=="rest"?"Rest":""));
 $('t').textContent=countdown?countdown:(p.kind=="done"?"✓":left);$('r').textContent=p.round;$('rt').textContent=cfg.rounds;
 $('rem').textContent=fmt(Math.max(0,total()-elapsed));const n=countdown?plan[0]:plan[pi+1],w=plan[pi+2],up=!countdown&&p.kind=='work'&&n&&n.kind=='rest'&&w&&w.kind=='work'&&w.exercise?w:null;$('next').textContent=up?`Next: ${up.exercise}`:n&&!countdown?`Next: ${n.exercise||n.kind} ${n.seconds}s`:"";
 $('bar').firstChild.style.width=(100*elapsed/total())+"%";$('sk').disabled=$('end').disabled=!started||logged}
function beep(f=880,d=.12){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function tick(){if(countdown){countdown--;beep(countdown?660:1320,countdown?.1:.25);draw();return}left--;elapsed++;if(left<=3&&left>0)beep();if(left<=0){next();return}draw()}
function next(){pi++;beep(1320,.25);if(navigator.vibrate)navigator.vibrate(200);if(pi>=plan.length){stop();finish("completed");return}left=plan[pi].seconds;draw()}
function stop(){clearInterval(iv);iv=null;$('b').textContent=logged?"Done":"Start"}
async function start(){if(logged)return;if(iv){stop();$('b').textContent="Resume";return}if(!started){started=true;countdown=readyS();if(countdown)beep(660,.1)}
 iv=setInterval(tick,1000);$('b').textContent="Pause";draw();try{await navigator.wakeLock?.request("screen")}catch(e){}}
function roundsDone(){if(pi>=plan.length)return cfg.rounds;const p=plan[pi];return Math.max(0,(p.round||0)-(p.kind=="work"||p.kind=="warmup"?1:0))}
function finish(status){if(logged||!started)return;const rd=roundsDone();logged=true;stop();pi=plan.length;draw();$('b').disabled=true;
 const summary=`${cfg.name}: ${rd}/${cfg.rounds} rounds, ${fmt(elapsed)} (${status})`;
 const manual=()=>{$('msg').innerHTML=`${summary}<br>Tell the chat: <code>finished HIIT${hiitId!=null?" #"+hiitId:""} — ${rd} rounds, ${elapsed}s</code>`};
 if(!bridge||hiitId==null){manual();return}
 call("tools/call",{name:"log_hiit",arguments:{hiit_id:hiitId,completed_rounds:rd,total_seconds:elapsed,status}})
  .then(r=>{r&&!r.isError?$('msg').textContent=summary+" — logged ✓":manual()}).catch(manual)}
$('b').onclick=start;$('sk').onclick=()=>{if(started&&!logged&&!countdown&&pi<plan.length){elapsed+=left;next()}};
$('end').onclick=()=>finish(pi>=plan.length?"completed":"aborted");
function send(m){window.parent.postMessage(m,"*")}
function call(method,params){const id=rid++;send({jsonrpc:"2.0",id,method,params});return new Promise((res,rej)=>{pending[id]={res,rej};setTimeout(()=>{if(pending[id]){delete pending[id];rej("timeout")}},10000)})}
function apply(sc){if(!sc)return;if(sc.rounds)cfg={...cfg,...sc};if(sc.hiit_id!=null)hiitId=sc.hiit_id;if(!started)build()}
window.addEventListener("message",e=>{const m=e.data;if(!m||m.jsonrpc!=="2.0")return;
 if(m.id!=null&&pending[m.id]&&!m.method){const p=pending[m.id];delete pending[m.id];m.error?p.rej(m.error):p.res(m.result);return}
 if(m.method&&m.method.startsWith("ui/"))bridge=true;
 if(m.method==="ui/notifications/tool-result")apply(m.params&&m.params.structuredContent);
 if(m.method==="ui/notifications/tool-input"){const a=m.params&&m.params.arguments;if(a&&a.rounds&&!started){cfg={...cfg,...a};build()}}});
if(window.parent!==window)call("ui/initialize",{protocolVersion:"2026-01-26",appInfo:{name:"workout-hiit",version:"1.1"},appCapabilities:{}})
 .then(()=>{bridge=true;send({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}})}).catch(()=>{});
try{if(window.openai&&window.openai.toolOutput)apply(window.openai.toolOutput)}catch(e){}
function fromHash(){try{if(location.hash.length>1){let s=location.hash.slice(1).replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";
 apply(JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))))}}catch(e){$('msg').textContent="Bad link"}}
build();fromHash();
</script></body></html>
