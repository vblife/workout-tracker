  var base,len,nk,n=now();if(phase==="ready"){base=readyEnd-ready*1000;len=ready;nk=steps[0]&&steps[0].kind}
  else{var s=steps[idx];if(!s||!gTimed(s))return;base=t0;len=gLen(s);nk=steps[idx+1]?steps[idx+1].kind:"finish"}
  var plan=gCues(len,nk);function at(off){return ac.currentTime+(base+off*1000-n)/1000}
  plan.cues.forEach(function(c){var a=at(c.t);if(a>=ac.currentTime-0.05)playCue(c,Math.max(ac.currentTime+0.005,a))});
  if(tickOn&&phase==="step")plan.ticks.forEach(function(k){var a=at(k);if(a>=ac.currentTime-0.05&&a<ac.currentTime+HORIZON)playTick(Math.max(ac.currentTime+0.005,a))})}
 function enter(i,at){idx=i;t0=at;if(idx>=steps.length){finish("finished");return}phase="step";schedule();var s=steps[idx];
  say(s.kind==="rest"?t("rest"):title(s));vibe(200);draw()}
 function finish(kind){if(phase==="finished")return;phase="finished";ended=kind;running=false;armed=0;
  setTimeout(clearScheduled,2500);releaseAwake();say(t("done"));vibe([300,100,300,100,600]);showSummary();status();draw()}
 function begin(){ambientAudio();ensureAudio();if(ac)ac.onstatechange=function(){if(phase==="step"||phase==="ready")schedule();status()};
  running=true;acquireAwake();if(ready>0){phase="ready";readyEnd=now()+ready*1000;schedule();draw()}else enter(0,now())}
 function catchUp(){var n=now();if(phase==="ready"&&n>=readyEnd)enter(0,readyEnd);
  if(phase!=="step")return;var r=gCatchUp(steps,idx,t0,n);if(r.idx!==idx){r.done.forEach(record);enter(r.idx,r.t0)}}
 function markDone(){catchUp();if(phase!=="step")return;var s=steps[idx],n=now();if(s.kind!=="rest")record(gEntry(s,(n-t0)/1000,false,n));enter(idx+1,n)}
 function skipSet(){catchUp();if(phase!=="step"||steps[idx].kind==="rest")return;var j=idx+1;if(steps[j]&&steps[j].kind==="rest")j++;enter(j,now())}
 function pauseToggle(){if(phase==="idle"){begin();return}
  if(phase==="ready"||phase==="step"){resumeTo=phase;pausedAt=now();phase="paused";running=false;clearScheduled();releaseAwake();if(SPEECH&&window.speechSynthesis)try{speechSynthesis.cancel()}catch(e){}}
  else if(phase==="paused"){var sh=now()-pausedAt;t0+=sh;readyEnd+=sh;phase=resumeTo;ambientAudio();ensureAudio();running=true;acquireAwake();schedule()}
  status();draw()}
 function endTap(){if(phase==="idle"||phase==="finished")return;if(armed&&now()-armed<4000){finish("ended_early");return}armed=now();draw();setTimeout(draw,4100)}
 function showSummary(){var ol=$("list");ol.innerHTML="";
  completed.forEach(function(e){var li=document.createElement("li");li.textContent=entryText(e);ol.appendChild(li)});
  if(!completed.length){var li=document.createElement("li");li.textContent=t("noneDone");ol.appendChild(li)}
  ol.hidden=false;var data=report();document.body.setAttribute("data-guided-summary",JSON.stringify(data));
  if(!LOG){handoff(data,"tellBot");return}
  /* MCP Apps: log any pending Done sets, then finish_workout. Never asks; skipped or unreached sets are never logged. */
  $("msg").textContent=t("saving");
  APP.ready.then(function(on){if(!on){handoff(data,"tellBot");return}
   LOG.finish().then(function(st){data.auto_log=st;document.body.setAttribute("data-guided-summary",JSON.stringify(data));progress();
    if(st.finished){$("msg").textContent=t("autoDone",{n:st.sets,m:works})}
    else handoff(data,st.failed.length?"logFail":"finishFail",{n:st.failed.length})})})}
 /* Offline fallback (or an auto-log failure): the user hands the summary to Workout Bot. */
 function handoff(data,key,vars){$("msg").textContent=t(key,vars);$("forBot").hidden=false;$("forBot").textContent=t("forBot");
  var pre=$("summary");pre.textContent=JSON.stringify(data,null,1);pre.hidden=false}
 function entryText(e){if(!e)return"";var p=presc({kind:"work",sets:e.sets,set_index:e.set_index,reps:e.reps,weight:e.weight,unit:e.unit,duration_s:e.duration_s,distance_m:e.distance_m});
  return title({kind:e.is_warmup?"warmup":"work",label:e.label})+(p?" \u00b7 "+p:"")}
 function draw(){if(phase!=="idle"&&phase!=="finished")catchUp();var b=document.body,s=steps[idx],n=clock(),st=$("start"),dn=$("doneBtn"),sk=$("skip"),rs=$("reset");
  var view=phase==="paused"?resumeTo:phase;
  b.className=phase==="idle"?"idle":phase==="finished"?"done":phase==="paused"?"paused":view==="ready"?"ready":s.kind;
  $("label").textContent=label;
  if(phase==="finished"){$("phase").textContent=t(ended==="finished"?"finished":"stopped");$("time").textContent=completed.length+"/"+works;
   $("sub").textContent=t("completedN",{n:completed.length,m:works});$("next").textContent=""}
  else if(phase==="idle"){$("phase").textContent=title(steps[0]);$("time").textContent=steps[0]&&steps[0].duration_s?fmt(steps[0].duration_s):fmt(0);
   $("sub").textContent=presc(steps[0]);$("next").textContent=t("setsN",{n:works})}
  else if(view==="ready"){$("phase").textContent=t("ready");$("time").textContent=String(Math.max(0,Math.ceil((readyEnd-n)/1000-1e-6)));
   $("sub").textContent="";$("next").textContent=t("next")+": "+title(steps[0])}
  else{var el=Math.max(0,(n-t0)/1000);$("phase").textContent=s.kind==="rest"?t("rest"):title(s);
   $("time").textContent=gTimed(s)?fmt(gLen(s)-el):fmt(Math.floor(el));
   var nw=nextWork(idx+1);$("sub").textContent=s.kind==="rest"?"":presc(s);
   $("next").textContent=nw?t("next")+": "+title(nw)+(presc(nw)&&s.kind==="rest"?" \u00b7 "+presc(nw):""):""}
  $("bar").firstChild.style.width=(steps.length?100*Math.min(idx,steps.length)/steps.length:0)+"%";
  var active=phase==="step"||(phase==="paused"&&resumeTo==="step");
  dn.hidden=!active;dn.disabled=phase==="paused";dn.textContent=active&&s.kind==="rest"?t("next"):t("setDone");
  sk.hidden=!active||s.kind==="rest";sk.disabled=phase==="paused";sk.textContent=t("skipSet");
  st.hidden=phase==="finished";st.textContent=phase==="idle"?t("start"):phase==="paused"?t("resume"):t("pause");st.className=phase==="ready"||phase==="step"?"pause":"";
  rs.hidden=phase==="idle"||phase==="finished";rs.textContent=armed&&now()-armed<4000?t("endConfirm"):t("end")}
 $("doneBtn").onclick=markDone;$("start").onclick=pauseToggle;$("skip").onclick=skipSet;$("reset").onclick=endTap;
 var tb=$("tickOn");$("tickBox").hidden=!TICK;tb.checked=tickOn;tb.onchange=function(){tickOn=tb.checked;schedule()};
 var aw=$("awake");aw.checked=wantAwake;aw.onchange=function(){wantAwake=aw.checked;if(wantAwake)acquireAwake();else releaseAwake();status()};
 document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){if(running){acquireAwake();if(ac&&ac.state!=="running")ac.resume&&ac.resume().catch(function(){});schedule()}draw()}});
 window.addEventListener("pageshow",draw);window.addEventListener("focus",draw);
 document.title=label;document.documentElement.lang=LANG;$("awakeLbl").textContent=t("keepAwake");$("tickLbl").textContent=t("tick");
 if(!steps.length){$("msg").textContent=t("badLink")}
 setInterval(draw,200);draw();
 window.__guided={steps:steps,done:markDone,skip:skipSet,toggle:pauseToggle,end:endTap,state:function(){return{phase:phase,idx:idx,completed:completed.slice(),ended:ended,auto_log:LOG?LOG.state():null}}};
}
if(cfg.mode==="guided"){guidedRunner();return}
$("start").onclick=toggle;$("reset").onclick=reset;$("skip").onclick=skip;
var tb=$("tickOn");$("tickBox").hidden=!TICK;tb.checked=tickOn;tb.onchange=function(){tickOn=tb.checked;if(running)reschedule()};
var aw=$("awake");aw.checked=wantAwake;aw.onchange=function(){wantAwake=aw.checked;if(wantAwake)acquireAwake();else releaseAwake();status()};
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){if(running){acquireAwake();if(ac&&ac.state!=="running")ac.resume&&ac.resume().catch(function(){});reschedule()}tick()}});
window.addEventListener("pageshow",tick);window.addEventListener("focus",tick);
document.title=label;document.documentElement.lang=LANG;$("start").textContent=t("start");$("reset").textContent=t("reset");$("skip").textContent=t("skip");$("awakeLbl").textContent=t("keepAwake");$("tickLbl").textContent=t("tick");
if(msgs.length)$("msg").textContent=t(msgs[0]);
setInterval(tick,200);draw();
window.__timer={get segs(){return segs},get cues(){return cues},get ticks(){return ticks},tickOn:function(){return tickOn},get total(){return T},get rounds(){return rounds},roundOptions:RO,pick:pickRounds,cfg:cfg,labels:L,state:function(){return{started:started,running:running,finished:finished,elapsed:elapsed(),seg:segAt(elapsed()),awake:awakeMode,audio:ac&&ac.state,scheduled:nodes.length}}};
}

var booted=false;
function go(c){if(booted)return;booted=true;boot(c)}

else{
 APP.onConfig=function(){if(APP.config)go(APP.config);else if(!booted){$0("label").textContent="Workout Bot";$0("msg").textContent=APP.error}};
