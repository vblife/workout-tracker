<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workout Bot Report</title><style>
:root{color-scheme:light dark;--bg:#f3f6fa;--card:#fff;--soft:#eef3fb;--fg:#152033;--muted:#667085;--accent:#316be8;--line:#dbe2ec;--good:#15803d}
@media(prefers-color-scheme:dark){:root{--bg:#0d121a;--card:#171e29;--soft:#202a38;--fg:#edf3fb;--muted:#9aa8ba;--accent:#78a6ff;--line:#2c394a;--good:#5ed58a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;padding:20px}.wrap{max-width:1060px;margin:auto}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px}h1{font-size:28px;line-height:1.15;margin:4px 0}.sub,.muted{color:var(--muted)}.sub{margin:0 0 18px}.layout{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}.full{grid-column:1/-1}.half{grid-column:span 6}.third{grid-column:span 4}h2{font-size:15px;margin:0 0 12px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{background:var(--soft);border-radius:12px;padding:11px}.value{font-size:23px;font-weight:760;line-height:1.15}.label{font-size:12px;color:var(--muted);margin-top:3px}.goals{display:grid;gap:9px}.goal-row{display:grid;grid-template-columns:1fr auto;gap:6px}.bar{grid-column:1/-1;height:6px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}.coach{font-size:16px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:var(--soft);border-radius:999px;padding:5px 9px}.confidence{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}button{border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:999px;padding:6px 10px;cursor:pointer}button.active{background:var(--accent);color:white;border-color:var(--accent)}svg{width:100%;height:230px;overflow:visible}.axis{stroke:var(--line);stroke-width:1}.trend-line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}.dot{fill:var(--accent)}.chart-label{fill:var(--muted);font-size:10px}.empty{color:var(--muted);padding:8px 0}.insight{padding:8px 0;border-top:1px solid var(--line)}.insight:first-child{border-top:0;padding-top:0}.good{color:var(--good)}
@media(max-width:720px){body{padding:10px}.half,.third{grid-column:1/-1}.metrics{grid-template-columns:1fr 1fr}.panel{padding:13px}h1{font-size:24px}svg{height:200px}}
</style></head><body><main class="wrap"><div class="eyebrow">Workout Bot</div><h1 id="title">Workout report</h1><p class="sub" id="range">Waiting for report data…</p>
<section class="layout">
 <article class="panel full" id="goal-progress"><h2>Goal progress</h2><div class="goals" id="goals"></div></article>
 <article class="panel full" id="coach-summary"><h2>Coach summary</h2><div class="coach" id="coach"></div></article>
 <article class="panel half" id="workout-totals"><h2>Workout totals</h2><div class="metrics" id="workout-metrics"></div></article>
 <article class="panel half" id="nutrition-summary"><h2>Nutrition</h2><div class="metrics" id="nutrition-metrics"></div></article>
 <article class="panel full" id="confidence"><h2>Estimate confidence</h2><div class="confidence" id="confidence-content"></div></article>
 <article class="panel full" id="trend-chart"><h2>Trends</h2><div class="tabs" id="trend-tabs"></div><svg viewBox="0 0 900 230" role="img" aria-label="Workout trend chart" id="chart"></svg><div class="empty" id="chart-empty"></div></article>
 <article class="panel third"><h2>Workout mix</h2><div class="chips" id="mix"></div></article>
 <article class="panel third"><h2>Routine usage</h2><div id="routines"></div></article>
 <article class="panel third"><h2>Streaks</h2><div id="streaks"></div></article>
 <article class="panel full" id="insights"><h2>Highlights & next steps</h2><div id="insight-list"></div></article>
</section></main><script>
const state={data:null,metric:null};const nutrients=[['calories_kcal','Calories'],['protein_g','Protein (g)'],['carbohydrates_g','Carbs (g)'],['fat_g','Fat (g)'],['fiber_g','Fiber (g)'],['sodium_mg','Sodium (mg)']];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v==null?'—':Number.isInteger(v)?String(v):Number(v).toFixed(1);const metric=(label,value,suffix='')=>`<div class="metric"><div class="value">${fmt(value)}${suffix}</div><div class="label">${esc(label)}</div></div>`;
function data(){return window.openai?.toolOutput||window.openai?.structuredContent||state.data||{}}
function renderGoals(d){const rows=d.goal_progress||[],el=document.querySelector('#goals');el.innerHTML=rows.length?rows.map(g=>{const target=g.target_value??g.upper_value??1,p=Math.max(0,Math.min(100,100*(g.current||0)/target));return `<div class="goal-row"><span>${esc(g.metric.replaceAll('_',' '))}</span><strong class="${g.achieved?'good':''}">${fmt(g.current)} / ${fmt(target)} ${esc(g.unit)}</strong><div class="bar"><i style="width:${p}%"></i></div></div>`}).join(''):'<div class="empty">No goals configured for this period.</div>'}
function draw(d){const pts=d.trend_series?.points||[],key=state.metric,svg=document.querySelector('#chart'),empty=document.querySelector('#chart-empty');if(!pts.length){svg.innerHTML='';empty.textContent='No trend data yet.';return}empty.textContent='';const vals=pts.map(p=>Number(p[key]||0)),hi=Math.max(...vals,1),x=i=>45+i*820/Math.max(1,pts.length-1),y=v=>190-v*155/hi;svg.innerHTML='<line class="axis" x1="45" y1="190" x2="865" y2="190"/>'+`<polyline class="trend-line" points="${vals.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`+vals.map((v,i)=>`<circle class="dot" cx="${x(i)}" cy="${y(v)}" r="4"><title>${esc(pts[i].period)}: ${fmt(v)}</title></circle><text class="chart-label" x="${x(i)}" y="210" text-anchor="middle">${esc(String(pts[i].period).slice(5))}</text>`).join('')}
function render(){const d=data(),s=d.summary||{},n=d.nutrition||{};document.querySelector('#title').textContent=(d.label||'Workout')+' report';document.querySelector('#range').textContent=[d.start,d.end_exclusive&&('through '+d.end_exclusive+' exclusive')].filter(Boolean).join(' ');renderGoals(d);
 const highlights=d.highlights||[];document.querySelector('#coach').textContent=highlights[0]||`${s.sessions||0} completed sessions and ${s.training_minutes||0} training minutes in this period.`;
 document.querySelector('#workout-metrics').innerHTML=metric('Completed sessions',s.sessions)+metric('Training minutes',s.training_minutes)+metric('Strength volume',s.volume,' '+esc(d.unit||''))+metric('Cardio minutes',s.cardio_minutes)+metric('Distance',s.distance,' '+esc(d.distance_unit||''))+metric('Estimated calories burned',s.estimated_calories);
 const average=d.period==='day'?'':'_daily_average';document.querySelector('#nutrition-metrics').innerHTML=nutrients.filter(([k])=>n[k+average]!=null||n[k]!=null).map(([k,l])=>metric((average?'Daily avg · ':'')+l,n[k+average]??n[k])).join('')||'<div class="empty">No confirmed nutrition entries.</div>';
 const cc=d.calorie_confidence_coverage||{},nc=n.confidence||{};document.querySelector('#confidence-content').innerHTML=`<div><strong>Workout calories</strong><div class="muted">${fmt(cc.estimated)} of ${fmt(cc.sessions)} sessions estimated · ${fmt(cc.rough)} rough</div></div><div><strong>Nutrition estimates</strong><div class="muted">${fmt(n.entries||0)} entries · ${fmt(nc.higher||0)} higher · ${fmt(nc.moderate||0)} moderate · ${fmt(nc.rough||0)} rough</div></div>`;
 const primary=d.trend_series?.primary_training_metric==='training_days'?['training_days','Training days']:['training_minutes','Training time'];const tabs=[primary,['strength_volume','Strength volume'],['cardio_minutes','Cardio time']];if(!tabs.some(([k])=>k===state.metric))state.metric=primary[0];document.querySelector('#trend-tabs').innerHTML=tabs.map(([k,l])=>`<button class="${state.metric===k?'active':''}" data-key="${k}">${l}</button>`).join('');document.querySelectorAll('#trend-tabs button').forEach(b=>b.onclick=()=>{state.metric=b.dataset.key;render()});draw(d);
 const mix=s.sessions_by_type||{};document.querySelector('#mix').innerHTML=Object.entries(mix).map(([k,v])=>`<span class="chip">${esc(k)} · ${fmt(v)}</span>`).join('')||'<span class="empty">No completed workouts.</span>';document.querySelector('#routines').innerHTML=(d.routine_usage||[]).map(r=>`<div class="insight">${esc(r.name)} · ${fmt(r.sessions)} session(s)</div>`).join('')||'<div class="empty">No routine starts in this period.</div>';
 const a=d.adherence||{};document.querySelector('#streaks').innerHTML=`<div class="value">${fmt(a.longest_day_streak||0)}</div><div class="label">Longest day streak</div><div class="muted">${fmt(a.weeks_meeting_target||0)} of ${fmt(a.weeks||0)} weeks met target</div>`;const extra=[...highlights.slice(1),...(d.prs||[]).slice(-3).map(p=>`PR · ${p.exercise}: ${fmt(p.weight)} ${d.unit||''} × ${p.reps}`)];document.querySelector('#insight-list').innerHTML=extra.map(x=>`<div class="insight">${esc(x)}</div>`).join('')||'<div class="empty">Keep logging to unlock tailored highlights.</div>'}
window.addEventListener('openai:set_globals',e=>{state.data=e.detail?.globals?.toolOutput;render()});render();
</script></body></html>
