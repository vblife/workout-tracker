<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workout Progress</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:14px;color:#111;background:#fafafa}h2{margin:0 0 4px;font-size:19px}h3{font-size:15px;margin:16px 0 6px}
.sub{opacity:.65;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-top:10px}
.card{background:#fff;border-radius:10px;padding:8px 10px;box-shadow:0 1px 2px #0002}.card b{display:block;font-size:20px}.card span{font-size:12px;opacity:.7}
.up{color:#0a7d2c}.down{color:#b3261e}svg{width:100%;height:auto;background:#fff;border-radius:10px;box-shadow:0 1px 2px #0002}
table{border-collapse:collapse;width:100%;font-size:13px;background:#fff;border-radius:10px;overflow:hidden}td,th{padding:5px 7px;border-bottom:1px solid #eee;text-align:left}
ul{padding-left:18px;margin:4px 0}.tabs button{font-size:13px;margin:2px;padding:4px 10px;border-radius:12px;border:1px solid #aaa;background:#fff}.tabs .on{background:#111;color:#fff}
#empty{padding:30px;text-align:center;opacity:.6}
</style></head><body><div id="root"><div id="empty">Loading…</div></div>
<script>
const R=document.getElementById("root"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>v==null?"–":(Math.abs(v)>=10000?Math.round(v).toLocaleString():(+v).toLocaleString(undefined,{maximumFractionDigits:1}));
function chart(points,key,{type="line",unit="",h=180}={}){const P=points.filter(p=>p[key]!=null);if(!P.length)return'<div class="sub">No data yet.</div>';
 const W=600,pad={l:44,r:10,t:12,b:28},vs=P.map(p=>+p[key]),mx=Math.max(...vs),mn=type=="bar"?0:Math.min(...vs),rg=(mx-mn)||1,iw=W-pad.l-pad.r,ih=h-pad.t-pad.b;
 const x=i=>pad.l+(P.length==1?iw/2:i*iw/(P.length-1)),y=v=>pad.t+ih-(v-mn)/rg*ih;let g="";
 for(let k=0;k<=3;k++){const v=mn+rg*k/3,yy=y(v);g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${yy}" y2="${yy}" stroke="#eee"/><text x="${pad.l-4}" y="${yy+4}" font-size="10" text-anchor="end" fill="#888">${num(v)}</text>`}
 const step=Math.ceil(P.length/8);P.forEach((p,i)=>{if(i%step==0)g+=`<text x="${type=="bar"?pad.l+(i+.5)*iw/P.length:x(i)}" y="${h-8}" font-size="10" text-anchor="middle" fill="#888">${esc(String(p.period).slice(5)||p.period)}</text>`});
 if(type=="bar"){const bw=iw/P.length*.7;P.forEach((p,i)=>{const yy=y(+p[key]);g+=`<rect x="${pad.l+(i+.15)*iw/P.length}" y="${yy}" width="${bw}" height="${pad.t+ih-yy}" fill="#3b6fd8" rx="2"><title>${esc(p.period)}: ${num(p[key])} ${unit}</title></rect>`})}
 else{g+=`<polyline fill="none" stroke="#3b6fd8" stroke-width="2.5" points="${P.map((p,i)=>x(i)+","+y(+p[key])).join(" ")}"/>`;P.forEach((p,i)=>g+=`<circle cx="${x(i)}" cy="${y(+p[key])}" r="3.5" fill="#3b6fd8"><title>${esc(p.period)}: ${num(p[key])} ${unit}</title></circle>`)}
 return `<svg viewBox="0 0 ${W} ${h}">${g}</svg>`}
const card=(v,l,d)=>`<div class="card"><b>${v}</b><span>${esc(l)}</span>${d&&d.pct!=null?`<div class="${d.change>=0?"up":"down"}" style="font-size:12px">${d.change>=0?"▲":"▼"} ${Math.abs(d.pct)}%</div>`:""}</div>`;
function renderProgress(d){const u=d.metric=="e1rm"||d.metric=="volume"||d.metric=="best_set"?d.unit:d.metric=="cardio_minutes"?"min":"";const s=d.stats||{};
 let h=`<h2>${esc(d.exercise||"Overall")} · ${esc(d.metric)}</h2><div class="sub">Range ${esc(d.range)} · by ${esc(d.group_by)}</div><div class="cards">`;
 if(d.kind=="exercise")h+=card(num(s.last)+" "+u,"latest")+card(num(s.best)+" "+u,"best")+card(s.change_pct==null?"–":(s.change_pct>0?"+":"")+s.change_pct+"%","change");
 else h+=card(num(s.total)+" "+u,"total")+card(num(s.best)+" "+u,"best "+d.group_by)+card(s.periods,"periods");
 h+=`</div><h3>Trend</h3>`+chart(d.points,"value",{type:d.kind=="exercise"?"line":"bar",unit:u});
 if(d.prs&&d.prs.length)h+=`<h3>PRs</h3><table><tr><th>Date</th><th>Set</th><th>e1RM</th></tr>${d.prs.slice().reverse().map(p=>`<tr><td>${p.date}</td><td>${num(p.weight)} ${d.unit} × ${p.reps}</td><td>${num(p.e1rm)}</td></tr>`).join("")}</table>`;
 R.innerHTML=h}
let RD=null,RK="volume";
function renderReport(d){RD=d;const s=d.summary,v=d.vs_previous||{},a=d.adherence;
 let h=`<h2>${esc({week:"Weekly",month:"Monthly",quarter:"Quarterly",year:"Annual",all:"All-time"}[d.period])} report</h2><div class="sub">${esc(d.label)}${v.label?" · vs "+esc(v.label):""}</div><div class="cards">`;
 h+=card(s.days_trained,"training days",v.days_trained)+card(s.sessions,"sessions",v.sessions)+card(s.sets,"sets",v.sets)+card(num(s.volume)+" "+d.unit,"volume",v.volume)
  +card(s.cardio_minutes+"m","cardio",v.cardio_minutes)+card(num(s.distance)+" "+d.distance_unit,"distance",v.distance)+card(s.hikes,"hikes")+card(s.hiit_sessions,"HIIT");
 h+=card(a.avg_days_per_week+"/"+d.target_days_per_week,"avg days/week")+card(a.weeks_meeting_target+"/"+a.weeks,"weeks on target")+`</div>`;
 if(d.highlights&&d.highlights.length)h+=`<h3>Highlights</h3><ul>${d.highlights.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
 const keys={volume:"Volume",sets:"Sets",cardio_minutes:"Cardio min",days:"Days"};
 h+=`<h3>By ${esc(d.series.group_by)}</h3><div class="tabs">${Object.entries(keys).map(([k,l])=>`<button class="${k==RK?"on":""}" onclick="RK='${k}';renderReport(RD)">${l}</button>`).join("")}</div>`+chart(d.series.points,RK,{type:"bar"});
 if(d.lifts&&d.lifts.length)h+=`<h3>Main lifts (e1RM, ${d.unit})</h3><table><tr><th>Exercise</th><th>Start→End</th><th>Δ</th><th>Best set</th></tr>${d.lifts.map(l=>`<tr><td>${esc(l.exercise)}${l.plateau_4w?" ⏸":""}</td><td>${num(l.e1rm_start)}→${num(l.e1rm_end)}</td><td class="${(l.e1rm_change_pct||0)>=0?"up":"down"}">${l.e1rm_change_pct??"–"}%</td><td>${num(l.best_set.weight)}×${l.best_set.reps}</td></tr>`).join("")}</table>`;
 if(d.prs&&d.prs.length)h+=`<h3>PRs</h3><ul>${d.prs.slice(-8).reverse().map(p=>`<li>${p.date} ${esc(p.exercise)} ${num(p.weight)}×${p.reps} (e1RM ${num(p.e1rm)})</li>`).join("")}</ul>`;
 const m=s.sets_by_muscle;if(m&&Object.keys(m).length)h+=`<h3>Sets by muscle</h3>`+chart(Object.entries(m).map(([k,v])=>({period:k,v})),"v",{type:"bar"});
 if(d.milestones)h+=`<h3>Milestones</h3><div class="sub">${d.milestones.sessions_total} sessions total · reached ${d.milestones.reached.join(", ")||"–"} · next ${d.milestones.next??"–"}</div>`;
 R.innerHTML=h}
function render(d){if(!d)return;try{d.period?renderReport(d):d.points?renderProgress(d):null}catch(e){R.innerHTML='<div id="empty">Render error: '+esc(e.message)+'</div>'}}
let rid=1;function send(m){window.parent.postMessage(m,"*")}
window.addEventListener("message",e=>{const m=e.data;if(!m||m.jsonrpc!=="2.0")return;if(m.method==="ui/notifications/tool-result")render(m.params&&m.params.structuredContent)});
if(window.parent!==window){send({jsonrpc:"2.0",id:rid++,method:"ui/initialize",params:{protocolVersion:"2026-01-26",appInfo:{name:"workout-charts",version:"1.0"},appCapabilities:{}}});
 setTimeout(()=>send({jsonrpc:"2.0",method:"ui/notifications/initialized",params:{}}),50)}
try{if(window.openai&&window.openai.toolOutput)render(window.openai.toolOutput)}catch(e){}
try{if(location.hash.length>1){let s=location.hash.slice(1).replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";render(JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))))}}catch(e){R.innerHTML='<div id="empty">Bad link</div>'}
</script></body></html>
