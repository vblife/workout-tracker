<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workout Bot Progress</title><style>
:root{color-scheme:light dark;--bg:#f7f8fb;--card:#fff;--fg:#17202b;--muted:#667085;--accent:#3972e6;--line:#dce1ea}@media(prefers-color-scheme:dark){:root{--bg:#10141b;--card:#191f29;--fg:#edf1f7;--muted:#9aa6b5;--accent:#78a6ff;--line:#303a48}}
*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}.box{max-width:820px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}h1{font-size:22px;margin:0 0 4px}.muted{color:var(--muted)}svg{width:100%;height:260px;margin-top:16px}.axis{stroke:var(--line)}.line{fill:none;stroke:var(--accent);stroke-width:3}.dot{fill:var(--accent)}@media(max-width:600px){body{padding:8px}.box{padding:11px}svg{height:210px}}
</style></head><body><main class="box"><h1 id="title">Progress</h1><div class="muted" id="summary">Waiting for data…</div><svg viewBox="0 0 700 250" id="chart" aria-label="Progress chart"></svg></main><script>
const state={};function render(){const d=window.openai?.toolOutput||state.data||{},pts=d.points||[];title.textContent=(d.exercise||'Overall')+' '+(d.metric||'progress');summary.textContent=(d.range||'')+' · '+pts.length+' periods';if(!pts.length){chart.innerHTML='';return}const vals=pts.map(p=>Number(p.value||0)),lo=Math.min(...vals),hi=Math.max(...vals),x=i=>30+i*640/Math.max(1,pts.length-1),y=v=>220-(v-lo)*190/Math.max(1,hi-lo);chart.innerHTML='<line class="axis" x1="30" y1="220" x2="670" y2="220"/>'+`<polyline class="line" points="${vals.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`+vals.map((v,i)=>`<circle class="dot" cx="${x(i)}" cy="${y(v)}" r="4"/>`).join('')}
window.addEventListener('openai:set_globals',e=>{state.data=e.detail?.globals?.toolOutput;render()});render();
</script></body></html>
