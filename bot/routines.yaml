# Scheduled Grok Bot routines created for every new Workout Bot.
# The bot creates these itself after the user confirms timezone and training days.
# Before creating them: call get_context; if timezone_missing is true, ask the
# user once for their timezone, confirm it, and save a valid IANA name with
# update_settings. Never assume Pacific time or UTC.
# Schedules are plain 5-field cron in user-local time. Create them exactly as
# written: no CRON_TZ= prefix and no other timezone field. {training_days} is the
# cron day-of-week list of the user's preferred training days (e.g. 1-5).
#   - Daily plan: 07:07 user-local.
#   - Workout reminder: 17:03 user-local on training days.
# Report routines share one pattern: call `report`, build a wide Grok Bot Page
# dashboard from its JSON, and send a short chat summary plus the Page link.
#   - Daily report: evening, about 20:30 user-local (flexible; move it if the user
#     usually finishes training or eating later). Compares today vs yesterday.
#   - Weekly report: Sunday 21:00 user-local. Compares this week vs the prior week.
routines:
  - slug: workout-daily-plan
    name: Daily plan
    schedule: "7 7 * * *"
    prompt: >-
      Build today's workout plan with the vblife-workout-daily-plan skill and send it.
      On a planned rest day send only the recovery recommendation. Do not start a
      workout or log anything.
  - slug: workout-reminder
    name: Workout reminder
    schedule: "3 17 * * {training_days}"
    prompt: >-
      Check get_active_workout and today's logs. If a workout is active or today's
      workout is complete, stay quiet. Otherwise send a short reminder with today's focus.
  - slug: workout-daily-report
    name: Daily report
    schedule: "30 20 * * *"
    prompt: >-
      Run the vblife-workout-report skill and call report with period=day and
      anchor_date set to today's user-local date. Build a wide Grok Bot Page (Canvas)
      dashboard from that JSON with the workout summary, nutrition summary,
      comparison to the previous day, distance to daily goals, and short
      actionable tips. Send a short text summary in the user's language plus the
      Page link. Do not attach report HTML. Never put food names on the Page.
  - slug: workout-weekly-report
    name: Weekly report
    schedule: "0 21 * * 0"
    prompt: >-
      Run the vblife-workout-report skill and call report with period=week and
      anchor_date set to today's user-local date. Build a wide Grok Bot Page (Canvas)
      dashboard from that JSON with six-week trends and comparison to the
      previous week, and send a short text summary in the user's language plus
      the Page link. Do not attach report HTML. Never put food names on the Page.
